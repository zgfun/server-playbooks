---
- name: Install ufw and fail2ban
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present

- name: Ensure sshd's privilege separation directory exists (missing on bare images)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/90-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Allow SSH before enabling the firewall (never lock yourself out)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
  tags: [service]

- name: Allow web ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ open_tcp_ports }}"
  tags: [service]

- name: Enable ufw with deny-by-default
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  tags: [service]

- name: Configure fail2ban for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: |
      [DEFAULT]
      bantime  = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  tags: [service]
